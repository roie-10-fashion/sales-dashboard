function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function fmtDec(n) { return n.toFixed(2); }
function usd(n) { return '$' + fmt(n); }
function usd2(n) { return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rmb(n) { return '¥' + fmt(n); }
function genId() { return Date.now() + Math.random(); }
function getRate(o) { return o.rate || DEFAULT_RATE; }
function getRMB(o) { return o.amountUSD * getRate(o); }

function loadData() {
  try {
    const s = localStorage.getItem('sales_dashboard_v5');
    if (s) {
      state.customers = JSON.parse(s);
    } else {
      state.customers = JSON.parse(JSON.stringify(initialCustomers));
      saveData();
    }
  } catch { state.customers = JSON.parse(JSON.stringify(initialCustomers)); }
}
function saveData() {
  try { localStorage.setItem('sales_dashboard_v5', JSON.stringify(state.customers)); } catch {}
}
function allOrders() {
  return state.customers.flatMap(c => c.orders.map(o => ({ ...o, customerName: c.name, customerId: c.id })));
}
function grandTotal() {
  let tUSD = 0, tRMB = 0, count = 0;
  state.customers.forEach(c => c.orders.forEach(o => { tUSD += o.amountUSD; tRMB += getRMB(o); count++; }));
  return { usd: tUSD, rmb: tRMB, count };
}
function availableYears() {
  const y = new Set(allOrders().map(o => o.etd.slice(0, 4)));
  if (y.size === 0) y.add('2025');
  return [...y].sort();
}

function render() {
  const app = document.getElementById('app');
  const gt = grandTotal();
  const years = availableYears();
  if (!years.includes(state.summaryYear)) state.summaryYear = years[years.length - 1] || '2025';
  app.innerHTML = `
    ${renderHeader(gt)}
    ${renderTabs()}
    <div class="content">
      ${state.activeTab === 'customers' ? (state.selectedCustomer ? renderCustomerDetail() : renderCustomersList()) : ''}
      ${state.activeTab === 'orders' ? renderAllOrders() : ''}
      ${state.activeTab === 'summary' ? renderSummary(gt, years) : ''}
    </div>`;
  bindEvents();
}

function renderHeader(gt) {
  return `
  <div class="header">
    <div>
      <h1>💰 מערכת ניהול מכירות</h1>
      <p class="header-sub">ריכוז הזמנות · לקוחות · סיכומים</p>
    </div>
    <div class="header-stats">
      <div class="stat-box gold">
        <div class="stat-label">סה״כ מכירות</div>
        <div class="stat-val-usd">${usd(gt.usd)}</div>
        <div class="stat-val-rmb">${rmb(gt.rmb)}</div>
      </div>
      <div class="stat-box blue">
        <div class="stat-label">שער ברירת מחדל</div>
        <input type="number" class="rate-input" value="${state.defaultRate}" step="0.01" id="defaultRate">
        <div class="rate-hint">להזמנות חדשות</div>
      </div>
      <div style="display:flex;gap:6px;flex-direction:column">
        <button class="btn-p" id="btnBackup" style="font-size:11px;padding:5px 12px;background:linear-gradient(135deg,#22c55e,#16a34a)">📥 גיבוי נתונים</button>
        <button class="btn-s" id="btnRestore" style="font-size:11px;padding:5px 12px;color:#e2e8f0;border-color:rgba(255,255,255,0.2)">📤 שחזור נתונים</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none">
      </div>
    </div>
  </div>`;
}

function renderTabs() {
  const tabs = [
    { key: 'customers', label: '👥 לקוחות', count: state.customers.length },
    { key: 'orders', label: '📋 כל ההזמנות', count: allOrders().length },
    { key: 'summary', label: '📊 סיכומים', count: null },
  ];
  return `<div class="tabs">${tabs.map(t => `
    <button class="tab-btn ${state.activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">
      ${t.label}
      ${t.count !== null ? `<span class="tab-badge">${t.count}</span>` : ''}
    </button>`).join('')}</div>`;
}

function renderCustomersList() {
  let html = `
    <div class="flex-between" style="margin-bottom:20px">
      <h2 style="font-size:20px;font-weight:700;color:#1e293b">רשימת לקוחות</h2>
      <button class="btn-p" id="btnAddCust">+ לקוח חדש</button>
    </div>`;
  if (state.showAddCustomer) {
    html += `<div class="card">
      <div class="flex gap-10 items-center flex-wrap">
        <input class="inp" placeholder="שם הלקוח" id="newCustName" autofocus style="flex:1;min-width:200px">
        <button class="btn-p" id="btnSaveCust">הוסף</button>
        <button class="btn-s" id="btnCancelCust">ביטול</button>
      </div>
    </div>`;
  }
  html += `<div class="grid gap-12">`;
  state.customers.forEach(c => {
    const tot = c.orders.reduce((s, o) => s + o.amountUSD, 0);
    const totRMB = c.orders.reduce((s, o) => s + getRMB(o), 0);
    const sorted = [...c.orders].sort((a, b) => b.etd.localeCompare(a.etd));
    const lastETD = sorted.length ? sorted[0].etd : '—';
    html += `
    <div class="card clickable" data-cust-id="${c.id}">
      <div class="flex-between flex-wrap gap-12">
        <div class="flex items-center gap-14">
          <div class="cust-icon">🏢</div>
          <div>
            <div style="font-size:16px;font-weight:700;color:#1e293b">${c.name}</div>
            <div style="font-size:12px;color:#64748b;margin-top:2px">${c.orders.length} הזמנות · ETD אחרון: ${lastETD}</div>
          </div>
        </div>
        <div class="flex items-center gap-16">
          <div style="text-align:left">
            <div style="font-size:17px;font-weight:700;color:#b45309">${usd(tot)}</div>
            <div style="font-size:12px;color:#d97706">${rmb(totRMB)}</div>
          </div>
          <div class="actions" onclick="event.stopPropagation()">
            ${state.confirmDeleteCust === c.id
              ? `<button class="btn-del-confirm" data-del-cust="${c.id}">אישור מחיקה</button>
                 <button class="btn-s" style="font-size:12px;padding:5px 12px" data-cancel-del-cust>ביטול</button>`
              : `<button class="btn-del" data-confirm-del-cust="${c.id}">🗑 מחק</button>`}
          </div>
          <span style="color:#cbd5e1;font-size:20px">‹</span>
        </div>
      </div>
    </div>`;
  });
  if (state.customers.length === 0) html += `<div class="empty-state"><div class="empty-icon">📭</div>אין לקוחות עדיין. לחץ על "לקוח חדש" כדי להתחיל.</div>`;
  html += `</div>`;
  return html;
}

function renderCustomerDetail() {
  const c = state.customers.find(x => x.id === state.selectedCustomer);
  if (!c) return '';
  const totUSD = c.orders.reduce((s, o) => s + o.amountUSD, 0);
  const totRMB = c.orders.reduce((s, o) => s + getRMB(o), 0);

  let html = `

        <div style="font-size:22px;font-weight:800;color:#eab308">${usd(totUSD)}</div>
        <div style="font-size:14px;color:#f59e0b;margin-top:2px">${rmb(totRMB)}</div>
      </div>
    </div>
    <div class="flex-between" style="margin-bottom:14px">
      <h3 style="font-size:16px;font-weight:600;color:#334155">היסטוריית הזמנות</h3>
      <button class="btn-p" id="btnAddOrder">+ הזמנה חדשה</button>
    </div>`;

  if (state.showAddOrder) {
    html += `
    <div class="card" style="margin-bottom:14px;border:2px dashed #eab308;background:#fffef5">
      <div style="font-size:13px;color:#92400e;margin-bottom:10px;font-weight:600">➕ הזמנה חדשה</div>
      <div class="flex gap-10 items-center flex-wrap">
        <div><div class="field-label">תאריך ETD</div><input type="date" class="inp" id="newETD"></div>
        <div><div class="field-label">PO #</div><input class="inp" id="newOrderPO" placeholder="מספר הזמנה" style="width:130px"></div>
        <div><div class="field-label">מחיר יחידה ($)</div><input type="number" class="inp" id="newUnitPrice" placeholder="0.00" step="0.01" style="width:110px"></div>
        <div><div class="field-label">כמות</div><input type="number" class="inp" id="newQty" placeholder="0" style="width:90px"></div>

          <div><div class="field-label">PO #</div><input class="inp" id="editPO" value="${(o.po || '').replace(/"/g, '&quot;')}" placeholder="מספר הזמנה" style="width:130px"></div>
          <div><div class="field-label">מחיר יחידה ($)</div><input type="number" class="inp" id="editUnitPrice" value="${o.unitPriceUSD != null ? o.unitPriceUSD : ''}" placeholder="0.00" step="0.01" style="width:110px"></div>
          <div><div class="field-label">כמות</div><input type="number" class="inp" id="editQty" value="${o.quantity != null ? o.quantity : ''}" placeholder="0" style="width:90px"></div>
          <div><div class="field-label">סכום ($)</div><input type="number" class="inp" id="editAmount" value="${o.amountUSD}" style="width:120px"></div>

          <div style="align-self:flex-end;padding:8px 0"><span id="editPreview" style="color:#d97706;font-size:13px;font-weight:600">= ${rmb(getRMB(o))}</span></div>
        </div>
        <div style="margin-top:10px">
          <div class="field-label">הערות</div>
          <input class="inp" id="editNotes" value="${(o.notes || '').replace(/"/g, '&quot;')}" placeholder="הערות להזמנה" style="width:100%">
        </div>
        <div class="flex gap-6" style="margin-top:10px">
            <button class="btn-p" id="btnSaveEdit">שמור</button>
            <button class="btn-s" id="btnCancelEdit">ביטול</button>
        </div>
      </div>`;
    } else {
      html += `
      <div class="card" style="padding:14px 18px">
        <div class="flex-between flex-wrap gap-8">
          <div class="flex items-center gap-12">
            <div>
              <span class="etd-label">ETD</span>
              <div style="color:#334155;font-size:14px;font-weight:600">${o.etd}</div>
            </div>
            ${o.po ? `<div>
              <span class="etd-label">PO #</span>
              <div style="color:#2563eb;font-size:14px;font-weight:600">${o.po}</div>
            </div>` : ''}
            ${(o.unitPriceUSD != null || o.quantity != null) ? `<div>
              <span class="etd-label">מחיר יחידה × כמות</span>
              <div style="color:#334155;font-size:14px;font-weight:600">${o.unitPriceUSD != null ? usd2(o.unitPriceUSD) : '—'} × ${o.quantity != null ? o.quantity.toLocaleString('en-US') : '—'}</div>
            </div>` : ''}
          </div>
          <div class="flex items-center gap-12">
            <div>
              <span style="color:#b45309;font-weight:700;font-size:15px">${usd(o.amountUSD)}</span>
              <span style="color:#cbd5e1;margin:0 6px">|</span>
              <span style="color:#d97706;font-size:13px;font-weight:500">${rmb(getRMB(o))}</span>
            </div>
            <span class="rate-badge">שער ${fmtDec(getRate(o))}</span>
            <div class="actions">
              <button class="btn-edit" data-edit-order="${o.id}">✏️ ערוך</button>
              ${state.confirmDelete === o.id
                ? `<button class="btn-del-confirm" data-del-order="${o.id}">אישור</button>
                   <button class="btn-s" style="font-size:11px;padding:4px 10px" data-cancel-del>לא</button>`
                : `<button class="btn-del" data-confirm-del-order="${o.id}">🗑 מחק</button>`}
            </div>
          </div>
        </div>
        ${o.notes ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:13px;color:#64748b">📝 ${o.notes}</div>` : ''}
      </div>`;

  });
  if (c.orders.length === 0) html += `<div class="text-center" style="padding:40px;color:#94a3b8">אין הזמנות עדיין. לחץ על "הזמנה חדשה" להוספה.</div>`;

  return html;

      <button class="btn-s" id="btnExportCSV">📥 ייצוא CSV</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
    <table>
      <thead><tr><th>לקוח</th><th>תאריך ETD</th><th>PO #</th><th>מחיר יחידה ($)</th><th>כמות</th><th>סכום (USD)</th><th>שער</th><th>סכום (RMB)</th></tr></thead>
      <tbody>`;
  orders.forEach(o => {
    html += `<tr>
      <td><span style="font-weight:600;color:#1e293b">${o.customerName}</span></td>
      <td style="color:#475569">${o.etd}</td>
      <td style="color:#2563eb;font-weight:600">${o.po || '—'}</td>
      <td style="color:#475569">${o.unitPriceUSD != null ? usd2(o.unitPriceUSD) : '—'}</td>
      <td style="color:#475569">${o.quantity != null ? o.quantity.toLocaleString('en-US') : '—'}</td>

}

function renderSummary(gt, years) {
  const orders = allOrders().filter(o => o.etd.startsWith(state.summaryYear));
  const months = Array.from({ length: 12 }, (_, i) => ({ month: i, label: MONTHS_HE[i], totalUSD: 0, totalRMB: 0, count: 0 }));
  orders.forEach(o => {
    const m = parseInt(o.etd.slice(5, 7)) - 1;
    months[m].totalUSD += o.amountUSD;
    months[m].totalRMB += getRMB(o);
    months[m].count++;
  });
  const maxM = Math.max(...months.map(m => m.totalUSD), 1);
  const yearMap = {};
  allOrders().forEach(o => {
    const y = o.etd.slice(0, 4);
    if (!yearMap[y]) yearMap[y] = { year: y, totalUSD: 0, totalRMB: 0, count: 0 };
    yearMap[y].totalUSD += o.amountUSD;
    yearMap[y].totalRMB += getRMB(o);
    yearMap[y].count++;
  });
  const yearlyData = Object.values(yearMap).sort((a, b) => b.year.localeCompare(a.year));

  let html = `
    <div class="flex-between flex-wrap gap-12" style="margin-bottom:20px">
      <h2 style="font-size:20px;font-weight:700;color:#1e293b">סיכומים (לפי ETD)</h2>
      <div class="flex gap-8 items-center">
        ${state.summaryView === 'monthly' ? `
          <select class="inp" id="summaryYear" style="width:auto;padding:6px 12px">
            ${years.map(y => `<option value="${y}" ${y === state.summaryYear ? 'selected' : ''}>${y}</option>`).join('')}
          </select>` : ''}
        <button class="${state.summaryView === 'monthly' ? 'btn-p' : 'btn-s'}" data-summary="monthly">חודשי</button>
        <button class="${state.summaryView === 'yearly' ? 'btn-p' : 'btn-s'}" data-summary="yearly">שנתי</button>
      </div>
    </div>`;

  if (state.summaryView === 'monthly') {
    html += `<div class="card" style="margin-bottom:20px;padding:24px">
      <h3 style="margin-bottom:16px;font-size:15px;font-weight:600;color:#64748b">מכירות חודשיות לפי ETD — ${state.summaryYear}</h3>
      <div class="chart-container">`;
    months.forEach(m => {
      const h = Math.max((m.totalUSD / maxM) * 130, m.totalUSD > 0 ? 8 : 2);
      const bg = m.totalUSD > 0 ? 'linear-gradient(180deg, #eab308, #d97706)' : '#f1f5f9';
      html += `<div class="chart-col"><div class="chart-bar" style="height:${h}px;background:${bg}"></div><div class="chart-label">${m.label.slice(0, 3)}</div></div>`;
    });
    html += `</div></div><div class="grid gap-8">`;
    months.filter(m => m.count > 0).forEach(m => {
      html += `<div class="card" style="padding:14px 18px"><div class="flex-between">
        <div><span style="font-weight:700;color:#1e293b">${m.label} ${state.summaryYear}</span>
        <span style="color:#94a3b8;margin-right:10px;font-size:12px">${m.count} הזמנות</span></div>
        <div class="flex gap-16"><span style="color:#b45309;font-weight:700">${usd(m.totalUSD)}</span>
        <span style="color:#d97706;font-size:14px">${rmb(m.totalRMB)}</span></div>
      </div></div>`;
    });
    if (months.filter(m => m.count > 0).length === 0) html += `<div class="text-center" style="padding:40px;color:#94a3b8">אין נתונים לשנה ${state.summaryYear}</div>`;
    html += `</div>`;
  }

  if (state.summaryView === 'yearly') {
    html += `<div class="grid gap-12">`;
    yearlyData.forEach(y => {
      html += `<div class="card" style="padding:18px 22px"><div class="flex-between">
        <div><div style="font-size:22px;font-weight:800;color:#1e293b">${y.year}</div>
        <div style="font-size:12px;color:#64748b">${y.count} הזמנות</div></div>
        <div style="text-align:left"><div style="font-size:20px;font-weight:700;color:#b45309">${usd(y.totalUSD)}</div>
        <div style="font-size:14px;color:#d97706">${rmb(y.totalRMB)}</div></div>
      </div></div>`;
    });
    if (yearlyData.length === 0) html += `<div class="text-center" style="padding:40px;color:#94a3b8">אין נתונים</div>`;
    html += `</div>`;
  }

  html += `
  <div class="card gold-border" style="margin-top:24px;padding:22px">
    <div class="flex-between flex-wrap gap-12">
      <div><div style="font-size:14px;color:#92400e;font-weight:600">סה״כ כללי</div>
      <div style="font-size:13px;color:#b45309">${gt.count} הזמנות מ-${state.customers.length} לקוחות</div></div>
      <div style="text-align:left"><div style="font-size:28px;font-weight:800;color:#92400e">${usd(gt.usd)}</div>
      <div style="font-size:18px;color:#b45309;font-weight:600">${rmb(gt.rmb)}</div></div>
    </div>
  </div>`;
  return html;
}

function bindEvents() {
  const drEl = document.getElementById('defaultRate');
  if (drEl) drEl.addEventListener('change', e => { state.defaultRate = parseFloat(e.target.value) || 1; });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab; state.selectedCustomer = null;
      state.showAddCustomer = false; state.showAddOrder = false;
      state.editingOrder = null; state.confirmDelete = null; state.confirmDeleteCust = null;
      render();
    });
  });

  document.querySelectorAll('[data-cust-id]').forEach(el => {
    el.addEventListener('click', () => {
      state.selectedCustomer = parseFloat(el.dataset.custId);
      state.showAddOrder = false; state.editingOrder = null;
      state.confirmDelete = null; state.confirmDeleteCust = null;
      render();
    });
  });

  const btnAddCust = document.getElementById('btnAddCust');
  if (btnAddCust) btnAddCust.addEventListener('click', () => { state.showAddCustomer = true; render(); });
  const btnCancelCust = document.getElementById('btnCancelCust');
  if (btnCancelCust) btnCancelCust.addEventListener('click', () => { state.showAddCustomer = false; render(); });
  const btnSaveCust = document.getElementById('btnSaveCust');
  if (btnSaveCust) btnSaveCust.addEventListener('click', () => {
    const name = document.getElementById('newCustName').value.trim();
    if (!name) return;
    state.customers.push({ id: genId(), name, orders: [] });
    state.showAddCustomer = false; saveData(); render();
  });
  const ncn = document.getElementById('newCustName');
  if (ncn) ncn.addEventListener('keydown', e => { if (e.key === 'Enter' && btnSaveCust) btnSaveCust.click(); });

  document.querySelectorAll('[data-confirm-del-cust]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteCust = parseFloat(btn.dataset.confirmDelCust); render(); });
  });
  document.querySelectorAll('[data-del-cust]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      state.customers = state.customers.filter(c => c.id !== parseFloat(btn.dataset.delCust));
      state.confirmDeleteCust = null; saveData(); render();
    });
  });
  document.querySelectorAll('[data-cancel-del-cust]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteCust = null; render(); });
  });

  const btnBack = document.getElementById('btnBack');
  if (btnBack) btnBack.addEventListener('click', () => { state.selectedCustomer = null; render(); });

  const btnAddOrder = document.getElementById('btnAddOrder');
  if (btnAddOrder) btnAddOrder.addEventListener('click', () => { state.showAddOrder = true; render(); });
  const btnCancelOrder = document.getElementById('btnCancelOrder');
  if (btnCancelOrder) btnCancelOrder.addEventListener('click', () => { state.showAddOrder = false; render(); });

  const nUnit = document.getElementById('newUnitPrice');
  const nQty = document.getElementById('newQty');
  const nAmt = document.getElementById('newOrderAmount');
  const nRate = document.getElementById('newOrderRate');
  const nPrev = document.getElementById('newOrderPreview');
  if (nUnit && nQty && nAmt) {
    const upAmt = () => {
      const u = parseFloat(nUnit.value), q = parseFloat(nQty.value);
      if (!isNaN(u) && !isNaN(q)) nAmt.value = (Math.round(u * q * 100) / 100);
    };
    nUnit.addEventListener('input', upAmt); nQty.addEventListener('input', upAmt);
  }
  if (nAmt && nRate && nPrev) {
    const up = () => {
      const a = parseFloat(nAmt.value) || 0, r = parseFloat(nRate.value) || 0;
      nPrev.innerHTML = a && r ? `<span style="color:#d97706;font-size:14px;font-weight:700">= ${rmb(a * r)}</span>` : '';
    };
    nAmt.addEventListener('input', up); nRate.addEventListener('input', up);
    if (nUnit && nQty) { nUnit.addEventListener('input', up); nQty.addEventListener('input', up); }
  }

  const btnSaveOrder = document.getElementById('btnSaveOrder');
  if (btnSaveOrder) btnSaveOrder.addEventListener('click', () => {
    const etd = document.getElementById('newETD').value;
    const amount = parseFloat(document.getElementById('newOrderAmount').value);
    const rate = parseFloat(document.getElementById('newOrderRate').value);
    if (!etd || !amount || !rate) return;
    const po = document.getElementById('newOrderPO').value.trim();
    const notes = document.getElementById('newOrderNotes').value.trim();
    const unitPriceRaw = document.getElementById('newUnitPrice').value;
    const qtyRaw = document.getElementById('newQty').value;
    const unitPriceUSD = unitPriceRaw !== '' ? parseFloat(unitPriceRaw) : null;
    const quantity = qtyRaw !== '' ? parseFloat(qtyRaw) : null;
    const c = state.customers.find(x => x.id === state.selectedCustomer);
    if (c) { c.orders.push({ id: genId(), etd, po, amountUSD: amount, rate, notes, unitPriceUSD, quantity }); state.showAddOrder = false; saveData(); render(); }
  });

  document.querySelectorAll('[data-edit-order]').forEach(btn => {
    btn.addEventListener('click', () => { state.editingOrder = parseFloat(btn.dataset.editOrder); render(); });
  });
  const btnCancelEdit = document.getElementById('btnCancelEdit');
  if (btnCancelEdit) btnCancelEdit.addEventListener('click', () => { state.editingOrder = null; render(); });

  const eUnit = document.getElementById('editUnitPrice');
  const eQty = document.getElementById('editQty');
  const eAmt = document.getElementById('editAmount');
  const eRate = document.getElementById('editRate');
  const ePrev = document.getElementById('editPreview');
  if (eUnit && eQty && eAmt) {
    const upAmt = () => {
      const u = parseFloat(eUnit.value), q = parseFloat(eQty.value);
      if (!isNaN(u) && !isNaN(q)) eAmt.value = (Math.round(u * q * 100) / 100);
    };
    eUnit.addEventListener('input', upAmt); eQty.addEventListener('input', upAmt);
  }
  if (eAmt && eRate && ePrev) {
    const up = () => {
      const a = parseFloat(eAmt.value) || 0, r = parseFloat(eRate.value) || 0;
      ePrev.textContent = a && r ? `= ${rmb(a * r)}` : '';
    };
    eAmt.addEventListener('input', up); eRate.addEventListener('input', up);
    if (eUnit && eQty) { eUnit.addEventListener('input', up); eQty.addEventListener('input', up); }
  }

  const btnSaveEdit = document.getElementById('btnSaveEdit');
  if (btnSaveEdit) btnSaveEdit.addEventListener('click', () => {
    const etd = document.getElementById('editETD').value;
    const amount = parseFloat(document.getElementById('editAmount').value);
    const rate = parseFloat(document.getElementById('editRate').value);
    if (!etd || !amount || !rate) return;
    const c = state.customers.find(x => x.id === state.selectedCustomer);
    if (c) {
      const o = c.orders.find(x => x.id === state.editingOrder);
      if (o) {
        o.etd = etd; o.amountUSD = amount; o.rate = rate;
        o.po = document.getElementById('editPO').value.trim();
        o.notes = document.getElementById('editNotes').value.trim();
        const unitPriceRaw = document.getElementById('editUnitPrice').value;
        const qtyRaw = document.getElementById('editQty').value;
        o.unitPriceUSD = unitPriceRaw !== '' ? parseFloat(unitPriceRaw) : null;
        o.quantity = qtyRaw !== '' ? parseFloat(qtyRaw) : null;
      }
      state.editingOrder = null; saveData(); render();
    }
  });

  document.querySelectorAll('[data-confirm-del-order]').forEach(btn => {
    btn.addEventListener('click', () => { state.confirmDelete = parseFloat(btn.dataset.confirmDelOrder); render(); });
  });
  document.querySelectorAll('[data-del-order]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = state.customers.find(x => x.id === state.selectedCustomer);
      if (c) c.orders = c.orders.filter(o => o.id !== parseFloat(btn.dataset.delOrder));
      state.confirmDelete = null; saveData(); render();
    });
  });
  document.querySelectorAll('[data-cancel-del]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); state.confirmDelete = null; render(); });
  });

  document.querySelectorAll('[data-summary]').forEach(btn => {
    btn.addEventListener('click', () => { state.summaryView = btn.dataset.summary; render(); });
  });
  const sy = document.getElementById('summaryYear');
  if (sy) sy.addEventListener('change', e => { state.summaryYear = e.target.value; render(); });

  const btnExport = document.getElementById('btnExportCSV');
  if (btnExport) btnExport.addEventListener('click', exportCSV);

  // Backup & Restore
  const btnBackup = document.getElementById('btnBackup');
  if (btnBackup) btnBackup.addEventListener('click', backupData);
  const btnRestore = document.getElementById('btnRestore');
  const restoreFile = document.getElementById('restoreFile');
  if (btnRestore && restoreFile) {
    btnRestore.addEventListener('click', () => restoreFile.click());
    restoreFile.addEventListener('change', restoreData);
  }
}

function exportCSV() {
  const orders = [...allOrders()].sort((a, b) => b.etd.localeCompare(a.etd));
  let csv = '﻿' + 'לקוח,תאריך ETD,PO,מחיר יחידה USD,כמות,סכום USD,שער,סכום RMB,הערות\n';
  orders.forEach(o => { csv += `"${o.customerName}",${o.etd},"${o.po || ''}",${o.unitPriceUSD != null ? o.unitPriceUSD : ''},${o.quantity != null ? o.quantity : ''},${o.amountUSD},${fmtDec(getRate(o))},${Math.round(getRMB(o))},"${o.notes || ''}"\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'sales_export.csv'; a.click();
  URL.revokeObjectURL(url);
}

function backupData() {
  const data = JSON.stringify(state.customers, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'sales_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  URL.revokeObjectURL(url);
  alert('✅ גיבוי הורד בהצלחה!');
}

function restoreData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) { alert('❌ קובץ לא תקין'); return; }
      if (!confirm('⚠️ שחזור יחליף את כל הנתונים הנוכחיים. להמשיך?')) return;
      state.customers = data;
      saveData();
      render();
      alert('✅ נתונים שוחזרו בהצלחה! ' + data.length + ' לקוחות נטענו.');
    } catch { alert('❌ שגיאה בקריאת הקובץ'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

loadData(); render();
</script>
