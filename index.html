function fmt(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDec(n) { return n.toFixed(2); }
function usd(n) { return '$' + fmt(n); }
function rmb(n) { return '¥' + fmt(n); }
function genId() { return Date.now() + Math.random(); }
function getRate(o) { return o.rate || DEFAULT_RATE; }
function getRMB(o) { return o.amountUSD * getRate(o); }

function loadData() {
  try {
    const s = localStorage.getItem('sales_dashboard_v5');
    if (s) {
      state.customers = JSON.parse(s);
    } else {
      state.customers = JSON.parse(JSON.stringify(initialCustomers));
      saveData();
    }
  } catch { state.customers = JSON.parse(JSON.stringify(initialCustomers)); }
}
function saveData() {
  try { localStorage.setItem('sales_dashboard_v5', JSON.stringify(state.customers)); } catch {}
}
function allOrders() {
  return state.customers.flatMap(c => c.orders.map(o => ({ ...o, customerName: c.name, customerId: c.id })));
}
function grandTotal() {
  let tUSD = 0, tRMB = 0, count = 0;
  state.customers.forEach(c => c.orders.forEach(o => { tUSD += o.amountUSD; tRMB += getRMB(o); count++; }));
  const exT = extrasSales(allExtras()); tUSD += exT; tRMB += exT * state.defaultRate;
  return { usd: tUSD, rmb: tRMB, count };
}
function invDate(o) { return o.invoiceDate || o.etd; }
function paidOf(o) { return (o.paidUSD != null && o.paidUSD !== '') ? o.paidUSD : o.amountUSD; }
function availableYears() {
  const y = new Set(allOrders().map(o => invDate(o).slice(0, 4)));
  if (y.size === 0) y.add('2025');
  return [...y].sort();
}

function render() {
  const app = document.getElementById('app');
  const gt = grandTotal();
  const years = availableYears();
  if (!years.includes(state.summaryYear)) state.summaryYear = years[years.length - 1] || '2025';
  app.innerHTML = `
    ${renderHeader(gt)}
    ${renderTabs()}
    <div class="content">
      ${state.activeTab === 'customers' ? (state.selectedCustomer ? renderCustomerDetail() : renderCustomersList()) : ''}
      ${state.activeTab === 'orders' ? renderAllOrders() : ''}
      ${state.activeTab === 'summary' ? renderSummary(gt, years) : ''}
    </div>`;
  bindEvents();
}

];
function extrasTotal(list) { return (list || []).reduce(function (s, e) { return s + (Number(e.amountUSD) || 0); }, 0); }
function extrasSales(list) { return (list || []).reduce(function (s, e) { var a = Number(e.amountUSD) || 0; return a > 0 ? s + a : s; }, 0); }
function allExtras() { var a = []; state.customers.forEach(function (c) { (c.extras || []).forEach(function (e) { a.push(e); }); }); return a; }
function addExtra() {
  var c = state.customers.find(function (x) { return x.id === state.selectedCustomer; });

  var amt = parseFloat(document.getElementById('exAmt').value);

}
function delExtra(id) {

}
function clkTime(tz) {
  return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: tz }).format(new Date());
}
function clkIsDay(t) { var h = parseInt(t.slice(0, 2), 10); return h >= 8 && h < 20; }
function clkHTML() {
  return CLOCKS.map(function (c) {

    return '<div class="clk"><span class="clk-dot' + (clkIsDay(t) ? ' on' : '') + '"></span><span class="clk-city">' + c.label + '</span><span class="clk-time" data-tz="' + (c.tz || '') + '">' + t + '</span></div>';
  }).join('');
}
function clkTick() {
  document.querySelectorAll('.clk-time').forEach(function (el) {
    var t = clkTime(el.getAttribute('data-tz') || undefined);
    el.textContent = t;
    var dot = el.parentNode.querySelector('.clk-dot');
    if (dot) dot.className = 'clk-dot' + (clkIsDay(t) ? ' on' : '');

}

function renderSummary(gt, years) {

    btn.addEventListener('click', e => {
      e.stopPropagation();

  });
  document.querySelectorAll('[data-cancel-del-cust]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteCust = null; render(); });

  const btnAddOrder = document.getElementById('btnAddOrder');

  if (btnCancelOrder) btnCancelOrder.addEventListener('click', () => { state.showAddOrder = false; render(); });

  const nAmt = document.getElementById('newOrderAmount');

    const up = () => {
      const a = parseFloat(nAmt.value) || 0, r = parseFloat(nRate.value) || 0;
      nPrev.innerHTML = a && r ? `<span style="color:#d97706;font-size:14px;font-weight:700">= ${rmb(a * r)}</span>` : '';
    };
    nAmt.addEventListener('input', up); nRate.addEventListener('input', up); const nQty = document.getElementById('newOrderQty'); const nUnitPrice = document.getElementById('newOrderUnitPrice'); const autoCalcNew = () => { const q = parseFloat(nQty.value), up2 = parseFloat(nUnitPrice.value); if (q && up2) { nAmt.value = (q * up2).toFixed(2); } up(); }; if (nQty) nQty.addEventListener('input', autoCalcNew); if (nUnitPrice) nUnitPrice.addEventListener('input', autoCalcNew);
  }

  if (eAmt && eRate && ePrev) {

      ePrev.textContent = a && r ? `= ${rmb(a * r)}` : '';
    };
    eAmt.addEventListener('input', up); eRate.addEventListener('input', up); const eQty = document.getElementById('editQty'); const eUnitPrice = document.getElementById('editUnitPrice'); const autoCalcEdit = () => { const q = parseFloat(eQty.value), up2 = parseFloat(eUnitPrice.value); if (q && up2) { eAmt.value = (q * up2).toFixed(2); } up(); }; if (eQty) eQty.addEventListener('input', autoCalcEdit); if (eUnitPrice) eUnitPrice.addEventListener('input', autoCalcEdit);
  }

  const btnSaveEdit = document.getElementById('btnSaveEdit');
  if (btnSaveEdit) btnSaveEdit.addEventListener('click', () => {
    const etd = document.getElementById('editETD').value;
    const amount = parseFloat(document.getElementById('editAmount').value);

    if (!etd || !amount || !rate) return;

    if (c) {

      state.editingOrder = null; saveData(); render();
    }
  });

  document.querySelectorAll('[data-confirm-del-order]').forEach(btn => {
    btn.addEventListener('click', () => { state.confirmDelete = parseFloat(btn.dataset.confirmDelOrder); render(); });
  });

    btn.addEventListener('click', () => {
      const c = state.customers.find(x => x.id === state.selectedCustomer);

  document.querySelectorAll('[data-summary]').forEach(btn => {
    btn.addEventListener('click', () => { state.summaryView = btn.dataset.summary; render(); });

  const sy = document.getElementById('summaryYear');

  const btnExport = document.getElementById('btnExportCSV');

  // Backup & Restore
  const btnBackup = document.getElementById('btnBackup');
  if (btnBackup) btnBackup.addEventListener('click', backupData);
  const btnRestore = document.getElementById('btnRestore');
  const restoreFile = document.getElementById('restoreFile');
  if (btnRestore && restoreFile) {
    btnRestore.addEventListener('click', () => restoreFile.click());
    restoreFile.addEventListener('change', restoreData);
  }
}

function exportCSV() {
  const orders = [...allOrders()].sort((a, b) => b.etd.localeCompare(a.etd));
  let csv = '\uFEFF' + 'לקוח,תאריך ETD,תאריך חשבונית,PO,כמות,מחיר יחידה USD,סכום USD,שער,סכום RMB,הערות\n';
  orders.forEach(o => { csv += `"${o.customerName}",${o.etd},${o.invoiceDate || ''},"${o.po || ''}",${o.qty != null ? o.qty : ''},${o.unitPrice != null ? fmtDec(o.unitPrice) : ''},${o.amountUSD},${fmtDec(getRate(o))},${getRMB(o).toFixed(2)},"${o.notes || ''}"\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'sales_export.csv'; a.click();
  URL.revokeObjectURL(url);
}

function backupData() {
  const data = JSON.stringify(state.customers, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'sales_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  URL.revokeObjectURL(url);
  alert('✅ גיבוי הורד בהצלחה!');
}

function restoreData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) { alert('❌ קובץ לא תקין'); return; }
      if (!confirm('⚠️ שחזור יחליף את כל הנתונים הנוכחיים. להמשיך?')) return;
      state.customers = data;
      saveData();
      render();
      alert('✅ נתונים שוחזרו בהצלחה! ' + data.length + ' לקוחות נטענו.');
    } catch { alert('❌ שגיאה בקריאת הקובץ'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

loadData(); render();

<script>
/* ===== Cloud sync (GitHub data.json) ===== */
(function () {
  var OWNER = 'roie-10-fashion', REPO = 'sales-dashboard', PATH = 'data.json', BR = 'main';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH;
  var TK = 'salesGhToken_v1', DK = 'sales_dirty_v1', PRE = 'sales_dashboard_v5_prebackup';
  if (location.hash.indexOf('#t=') === 0) { try { localStorage.setItem(TK, decodeURIComponent(location.hash.slice(3))); history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  var sha = null, remoteExists = false, pushing = false, again = false, timer = null, lastMsg = '';
  function tok() { return localStorage.getItem(TK) || ''; }
  function isDirty() { return localStorage.getItem(DK) === '1'; }
  function setDirty(v) { if (v) localStorage.setItem(DK, '1'); else localStorage.removeItem(DK); }
  function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64d(s) { return decodeURIComponent(escape(atob(s.split(String.fromCharCode(10)).join('')))); }
  function persistLocal() { try { localStorage.setItem('sales_dashboard_v5', JSON.stringify(state.customers)); } catch (e) {} }
  function idle() { return !state.showAddOrder && !state.showAddCustomer && !state.editingOrder; }

  function status(msg, color) {
    lastMsg = msg;
    var b = document.getElementById('cloudBadge');
    if (!b) return;
    b.textContent = msg;
    b.style.borderColor = color;
    b.style.color = color;
  }

  async function fetchRemote() {
    var h = { 'Accept': 'application/vnd.github+json' };
    if (tok()) h['Authorization'] = 'Bearer ' + tok();
    var res = await fetch(API + '?ref=' + BR + '&_=' + Date.now(), { headers: h, cache: 'no-store' });
    if (res.status === 404) { sha = null; remoteExists = false; return null; }
    if (!res.ok) throw new Error('load ' + res.status);
    var j = await res.json();
    sha = j.sha; remoteExists = true;
    return JSON.parse(b64d(j.content));
  }

  function merge(remoteC, localC) {
    var out = JSON.parse(JSON.stringify(remoteC || []));
    localC.forEach(function (lc) {
      var rc = out.find(function (x) { return x.id === lc.id; });
      if (!rc) { out.push(lc); return; }
      rc.name = lc.name;
      lc.orders.forEach(function (lo) {
        var i = rc.orders.findIndex(function (x) { return x.id === lo.id; });
        if (i < 0) rc.orders.push(lo); else rc.orders[i] = lo;
      });
    });
    return out;
  }

  async function push(force) {
    if (!tok()) { status('☁ אין חיבור לענן – לחץ', '#c9a35f'); return false; }
    if (pushing) { again = true; return false; }
    pushing = true;
    status('☁ שומר…', '#c9a35f');
    try {
      for (var attempt = 0; attempt < 2; attempt++) {
        var body = {
          message: 'עדכון נתונים ' + new Date().toISOString(),
          content: b64e(JSON.stringify({ customers: state.customers, defaultRate: state.defaultRate, updatedAt: Date.now() }, null, 1)),
          branch: BR
        };
        if (sha) body.sha = sha;
        var res = await fetch(API, {
          method: 'PUT',
          headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tok(), 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if ((res.status === 409 || res.status === 422) && attempt === 0) {
          var remote = await fetchRemote();
          if (remote && !force) { state.customers = merge(remote.customers, state.customers); persistLocal(); }
          continue;
        }
        if (!res.ok) throw new Error('save ' + res.status);
        var j = await res.json();
        sha = j.content.sha; remoteExists = true; setDirty(false);
        status('☁ נשמר בענן ✓', '#7fb685');
        pushing = false;
        if (again) { again = false; schedule(); }
        return true;
      }
    } catch (e) {
      status('☁ שגיאת שמירה – לחץ', '#d87a7a');
    }
    pushing = false;
    return false;
  }

  function schedule() {
    clearTimeout(timer);
    if (!tok() || !remoteExists) { status(tok() ? '☁ לא הועלה לענן – לחץ' : '☁ אין חיבור לענן – לחץ', '#c9a35f'); return; }
    timer = setTimeout(function () { push(false); }, 1200);
  }

  var origSave = saveData;
  saveData = function () { origSave(); setDirty(true); schedule(); };

  async function applyRemote(remote) {
    state.customers = remote.customers;
    if (remote.defaultRate) state.defaultRate = remote.defaultRate;
    persistLocal();
    render();
  }

  async function sync(initial) {
    try {
      var remote = await fetchRemote();
      if (!remote) { status(tok() ? '☁ לא הועלה לענן – לחץ' : '☁ אין חיבור לענן – לחץ', '#c9a35f'); return; }
      if (isDirty()) {
        if (tok()) {
          state.customers = merge(remote.customers, state.customers);
          persistLocal();
          await push(false);
          render();
        } else {
          status('☁ שינויים מקומיים לא נשמרו – לחץ', '#d87a7a');
        }
        return;
      }
      var same = JSON.stringify(remote.customers) === JSON.stringify(state.customers);
      if (!same) {
        if (!initial && !idle()) return;
        try { localStorage.setItem(PRE, JSON.stringify(state.customers)); } catch (e) {}
        await applyRemote(remote);
      }
      status('☁ מסונכרן ✓', '#7fb685');
    } catch (e) {
      status('☁ אין חיבור – עובד מקומית', '#d87a7a');
    }
  }

  function panel() {
    var old = document.getElementById('cloudPanel');
    if (old) { old.remove(); return; }
    var d = document.createElement('div');
    d.id = 'cloudPanel';
    d.style.cssText = 'position:fixed;bottom:60px;left:16px;z-index:9000;width:320px;background:#0d0d0d;color:#eee9dd;border:1px solid #a8864f;padding:16px;font-size:13px;direction:rtl;line-height:1.7';
    d.innerHTML = '<div style="font-weight:700;margin-bottom:6px">סנכרון לענן (GitHub)</div>' +
      '<div style="color:#a9a397;margin-bottom:8px">' + (tok() ? 'טוקן שמור במכשיר זה.' : 'הדבק טוקן GitHub (נשמר רק בדפדפן הזה).') + '</div>' +
      '<input type="password" id="cloudTok" placeholder="github_pat_..." style="width:100%;padding:6px;background:#1a1a1a;color:#fff;border:1px solid #444;margin-bottom:8px">' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
      '<button id="cloudSaveTok" class="btn-s" style="color:#fff;border-color:#a8864f">שמור טוקן</button>' +
      '<button id="cloudUpload" class="btn-s" style="color:#fff;border-color:#a8864f">העלה את הנתונים מהדפדפן הזה לענן</button>' +
      '<button id="cloudClose" class="btn-s" style="color:#fff;border-color:#555">סגור</button></div>' +
      '<div id="cloudMsg" style="margin-top:8px;color:#c9a35f"></div>';
    document.body.appendChild(d);
    document.getElementById('cloudClose').onclick = function () { d.remove(); };
    document.getElementById('cloudSaveTok').onclick = async function () {
      var v = document.getElementById('cloudTok').value.trim();
      if (!v) return;
      localStorage.setItem(TK, v);
      document.getElementById('cloudMsg').textContent = 'הטוקן נשמר.';
      await sync(false);
    };
    document.getElementById('cloudUpload').onclick = async function () {
      if (!tok()) { document.getElementById('cloudMsg').textContent = 'קודם שמור טוקן.'; return; }
      if (!confirm('להעלות את הנתונים מהדפדפן הזה לענן? זה יחליף את מה ששמור שם.')) return;
      try { await fetchRemote(); } catch (e) {}
      var ok = await push(true);
      document.getElementById('cloudMsg').textContent = ok ? 'הועלה בהצלחה ✓' : 'ההעלאה נכשלה – בדוק את הטוקן.';
    };
  }

  var badge = document.createElement('div');
  badge.id = 'cloudBadge';
  badge.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:9000;background:#0d0d0d;border:1px solid #a8864f;color:#c9a35f;font-size:12px;padding:6px 12px;cursor:pointer;direction:rtl';
  badge.onclick = panel;
  document.body.appendChild(badge);
  status('☁ בודק…', '#c9a35f');

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !pushing && !isDirty()) sync(false);
  });
  sync(true);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
